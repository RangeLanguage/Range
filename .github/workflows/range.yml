name: Range

on:
  pull_request:
  push:
    branches:
      - main
      - development
  workflow_dispatch:

jobs:
  check:
    name: C compiler foundation
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Validate compiler and testing tools
        run: |
          for tool in $(find Language/Compiler/Tools Testing/Tools -maxdepth 1 -type f); do
            if head -1 "$tool" | grep -qE '^#!.*(bash|sh)'; then
              bash -n "$tool"
            fi
          done

      - name: Verify compiler parser and execution kernel
        run: |
          Testing/Tools/check-compiler-parser
          Testing/Tools/check-compiler-graph
          Testing/Tools/check-compiler-evaluator
